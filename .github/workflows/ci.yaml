name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum
      - name: Check go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        # Pinned version (kept out of go.mod to avoid dragging its dep tree in).
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Test
        run: go test -race ./...
      - name: Build indomain
        run: go build -o "${{ runner.temp }}/indomain" ./cmd/indomain
      - name: Lint and render-check example models
        run: |
          set -euo pipefail
          shopt -s nullglob
          indomain="${{ runner.temp }}/indomain"
          files=(examples/*.modelith.yaml docs/05-parking-garage/*.modelith.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No example models found"
            exit 1
          fi
          "$indomain" lint --completeness error "${files[@]}"
          for f in "${files[@]}"; do
            "$indomain" render --check "$f"
          done
      - name: Validate plugin manifest
        # Lightweight structural check (jq is preinstalled on ubuntu-latest). The
        # full `claude plugin validate ./plugin --strict` runs locally via
        # `task check`; we don't pull the Claude Code CLI into this Go pipeline.
        run: |
          set -euo pipefail
          shopt -s nullglob
          pj=plugin/.claude-plugin/plugin.json
          [ -f "$pj" ] || { echo "::error::missing $pj"; exit 1; }
          jq empty "$pj"
          jq -e '.name' "$pj" >/dev/null || { echo "::error::$pj missing required field: name"; exit 1; }
          skills=(plugin/skills/*/SKILL.md)
          [ ${#skills[@]} -gt 0 ] || { echo "::error::no skills found under plugin/skills/*/SKILL.md"; exit 1; }
          for s in "${skills[@]}"; do
            head -n 1 "$s" | grep -q '^---$' || { echo "::error::$s missing YAML frontmatter"; exit 1; }
          done
          echo "plugin manifest + ${#skills[@]} skill(s) OK"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Mermaid parse check
        # Unlike the plugin-validation step above, this runs the real check —
        # the actual mmdc binary — rather than a lighter substitute, since
        # task mermaid-check is deliberately excluded from `task check` (it
        # needs node/npm, which `task check` must not require locally).
        run: bash hack/mermaid-check.sh
