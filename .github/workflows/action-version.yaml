name: Action version pin

# action.yaml pins a specific indomain release as its `version` input default.
# That bump is a manual step after every release (see CLAUDE.md's release
# checklist) and nothing else catches a forgotten one — a stale default just
# keeps installing an old release with no error. This guard compares the pinned
# default against the latest published release.

on:
  push:
    branches: [main]
    paths: [action.yaml]
  pull_request:
    paths: [action.yaml]
  # Catch a forgotten post-release bump even when no PR touches action.yaml.
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: action.yaml version default matches the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pinned=$(yq '.inputs.version.default' action.yaml)
          # `gh release list` returns an empty array (exit 0) when there are no
          # releases, but a non-zero exit on a real API error — so `set -e`
          # surfaces a genuine failure instead of it masquerading as "no release
          # yet" and silently skipping the guard.
          latest=$(gh release list --json tagName,isLatest --jq 'map(select(.isLatest)) | .[0].tagName // ""')
          if [ -z "$latest" ]; then
            echo "No published release yet; nothing to compare against."
            exit 0
          fi
          echo "action.yaml pins: $pinned ; latest release: $latest"
          if [ "$pinned" != "$latest" ]; then
            echo "::error file=action.yaml::action.yaml version default ($pinned) does not match the latest release ($latest). Bump the 'version' input default — see CLAUDE.md's release checklist."
            exit 1
          fi
